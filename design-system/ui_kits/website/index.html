<!-- @dsCard group="Website" viewport="1280x900" name="Marketing site" subtitle="Click-through recreation: home, packages, events, about and the quote form" -->
<!doctype html><html><head><meta charset="utf-8"><title>Riverside Fairways — Marketing site</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}body{font-family:var(--font-body);color:var(--text-primary);background:var(--bg-base)}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="PackagesScreen.jsx"></script>
<script type="text/babel" src="EventsScreen.jsx"></script>
<script type="text/babel" src="AboutScreen.jsx"></script>
<script type="text/babel" src="BookScreen.jsx"></script>
<script type="text/babel">
function App(){
  const [page,setPage]=React.useState('home');
  const [pkg,setPkg]=React.useState('clubhouse');
  const go=id=>{setPage(id);window.scrollTo(0,0);};
  return <>
    <SiteHeader basePath={ASSETS} nav={NAV} active={page} onNavigate={go} phone={PHONE} cta={{label:'Get a quote',onClick:()=>go('book')}} transparent={page==='home'||page==='events'}
      style={page==='home'||page==='events'?{position:'absolute',top:0,left:0,right:0}:null}/>
    {page==='home'&&<HomeScreen onNavigate={go}/>}
    {page==='packages'&&<PackagesScreen onNavigate={go} onSelect={setPkg}/>}
    {page==='events'&&<EventsScreen onNavigate={go}/>}
    {page==='about'&&<AboutScreen onNavigate={go}/>}
    {page==='book'&&<BookScreen selected={pkg} onSelect={setPkg}/>}
    <SiteFooter basePath={ASSETS} phone={PHONE} email={EMAIL}
      serviceArea="Based in Denham Springs — serving all of Louisiana and the Mississippi Gulf Coast."
      social={[{label:'Facebook',href:'https://www.facebook.com/riversidefairways'}]}
      columns={[{title:'Events',links:[{label:'Corporate'},{label:'Weddings'},{label:'Parties'},{label:'Charity'}]},{title:'Company',links:[{label:'Packages'},{label:'About'},{label:'Service area'}]}]}/>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
