<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-body);color:var(--text-primary);background:var(--bg-base);padding:20px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.b{height:110px;border-radius:var(--radius-md);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:11px;font-family:var(--font-mono)}</style></head><body><div class="g">
<div class="b" style="background:#7A6A58"><div style="position:absolute;inset:0;background:var(--overlay-hero)"></div><span style="position:relative">--overlay-hero 40%</span></div>
<div class="b" style="background:#7A6A58"><div style="position:absolute;inset:0;background:var(--overlay-scrim)"></div><span style="position:relative">--overlay-scrim</span></div>
<div class="b" style="background:var(--gradient-brand)"><span style="position:relative">--gradient-brand 135°</span></div>
</div></body></html>
