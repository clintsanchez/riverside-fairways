<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-body);color:var(--text-primary);background:var(--bg-base);padding:20px}.row{display:flex;gap:18px}.s{flex:1}.chip{height:64px;border-radius:var(--radius-swatch);box-shadow:var(--shadow-swatch);border:1px solid rgba(0,0,0,.06)}.n{font-size:12px;font-weight:600;margin-top:8px;color:var(--text-heading)}.h{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.u{font-size:11px;color:var(--text-muted);margin-top:2px}</style></head><body><div class="row"><div class="s"><div class="chip" style="background:#22A06B"></div><div class="n">Success</div><div class="h">#22A06B</div></div><div class="s"><div class="chip" style="background:#E8A33D"></div><div class="n">Warning</div><div class="h">#E8A33D</div></div><div class="s"><div class="chip" style="background:#D9534F"></div><div class="n">Error</div><div class="h">#D9534F</div></div></div></body></html>
