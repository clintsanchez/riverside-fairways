<!-- @dsCard group="Brand" viewport="700x200" name="Logo misuse" subtitle="Never stretch, recolor, add effects, or place on busy backgrounds" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-body);color:var(--text-primary);background:var(--bg-base);padding:20px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.t{height:110px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden;position:relative}.t img{max-width:100%;max-height:100%}.x{position:absolute;top:6px;right:8px;color:var(--rf-error);font-weight:700;font-size:14px}.c{font-size:11px;color:var(--text-muted);text-align:center;margin-top:6px}</style></head><body><div class="g">
<div><div class="t"><span class="x">✕</span><img src="../assets/logo-primary.png" style="width:100%;height:70px;object-fit:fill"></div><div class="c">Stretched</div></div>
<div><div class="t"><span class="x">✕</span><img src="../assets/logo-primary.png" style="filter:hue-rotate(200deg) saturate(2)"></div><div class="c">Recolored</div></div>
<div><div class="t"><span class="x">✕</span><img src="../assets/logo-primary.png" style="filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))"></div><div class="c">Effects added</div></div>
<div><div class="t" style="background:repeating-linear-gradient(45deg,#c9b7a4 0 10px,#8a7a68 10px 20px)"><span class="x">✕</span><img src="../assets/logo-primary.png"></div><div class="c">Busy background</div></div>
</div></body></html>
