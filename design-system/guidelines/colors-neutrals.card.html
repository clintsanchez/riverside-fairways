<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-body);color:var(--text-primary);background:var(--bg-base);padding:20px}.row{display:flex;gap:18px}.s{flex:1}.chip{height:64px;border-radius:var(--radius-swatch);box-shadow:var(--shadow-swatch);border:1px solid rgba(0,0,0,.06)}.n{font-size:12px;font-weight:600;margin-top:8px;color:var(--text-heading)}.h{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.u{font-size:11px;color:var(--text-muted);margin-top:2px}</style></head><body><div class="row"><div class="s"><div class="chip" style="background:#FFFFFF"></div><div class="n">White</div><div class="h">#FFFFFF</div></div><div class="s"><div class="chip" style="background:#F9F8F6"></div><div class="n">Off-White</div><div class="h">#F9F8F6</div></div><div class="s"><div class="chip" style="background:#EEEEEE"></div><div class="n">Light Gray</div><div class="h">#EEEEEE</div></div><div class="s"><div class="chip" style="background:#999999"></div><div class="n">Medium Gray</div><div class="h">#999999</div></div><div class="s"><div class="chip" style="background:#333333"></div><div class="n">Charcoal</div><div class="h">#333333</div></div></div></body></html>
