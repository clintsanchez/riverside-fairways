<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-body);color:var(--text-primary);background:var(--bg-base);padding:20px}.r{display:flex;align-items:flex-end;gap:14px}.c{text-align:center}.bar{background:var(--rf-green);border-radius:2px;height:28px}.l{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:6px}</style></head><body><div class="r">

</div></body></html>
